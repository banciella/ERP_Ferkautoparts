<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - FERKAUTOPARTS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0A2A4A url('bg.png') center/cover no-repeat fixed; }
  .box { width:min(380px, 92vw); background:rgba(0,0,0,0.45); backdrop-filter:blur(10px);
         padding:35px 30px; border-radius:16px; color:white; }
  .box h2 { text-align:center; font-size:24px; }
  .box p.sub { text-align:center; color:#2ecc71; font-size:11px; letter-spacing:2px; margin:6px 0 28px; }
  label { font-size:13px; display:block; margin-bottom:6px; }
  input { width:100%; padding:12px; border:none; border-radius:10px; margin-bottom:18px; font-size:15px; }
  button { width:100%; padding:12px; border:none; border-radius:10px; background:#2ecc71;
           color:white; font-weight:bold; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; }
  #erro { color:#ff7675; text-align:center; margin-top:14px; min-height:18px; font-size:13px; }
</style>
</head>
<body>
  <form class="box" id="formLogin">
    <h2>FERKAUTOPARTS</h2>
    <p class="sub">SISTEMA ERP</p>
    <label for="login">Usuário</label>
    <input id="login" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">Entrar</button>
    <div id="erro" aria-live="polite"></div>
  </form>
<script src="api.js"></script>
<script>
  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn'), erro = document.getElementById('erro');
    btn.disabled = true; erro.textContent = '';
    try {
      await Api.login(document.getElementById('login').value, document.getElementById('senha').value);
      location.href = 'index.html';
    } catch { erro.textContent = 'Usuário ou senha inválidos'; }
    finally { btn.disabled = false; }
  });
</script>
</body>
</html>
