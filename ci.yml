# Pipeline de Integração Contínua (CI) + Entrega Contínua (CD)
name: CI-CD ERP Ferkautoparts

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore api/FerkAutoparts.Api.csproj

      - name: Compilar
        run: dotnet build api/FerkAutoparts.Api.csproj -c Release --no-restore

      - name: Validar imagem Docker
        run: docker build -t erp-ferkautoparts .

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy no Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
